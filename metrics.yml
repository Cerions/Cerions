name: Metrics

on:
  # Aggiorna ogni giorno alle 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Permette di lanciarlo a mano dalla tab Actions
  workflow_dispatch:
  # Aggiorna anche a ogni push sul branch principale
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Statistiche generali
        uses: lowlighter/metrics@latest
        with:
          # Token salvato nei Secrets del repo (vedi istruzioni)
          token: ${{ secrets.METRICS_TOKEN }}
          user: Cerions
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Rome

      - name: Linguaggi più usati
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Cerions
          filename: github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Metti true se vuoi contare anche i repo privati
          plugin_languages_analysis_timeout: 15
